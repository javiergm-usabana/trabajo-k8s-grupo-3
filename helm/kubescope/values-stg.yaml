replicaCount: 2

image:
  repository: ghcr.io/OWNER/kubescope
  tag: replace-with-commit-sha
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-credentials

app:
  environment: staging
  version: replace-with-commit-sha
  message: KubeScope - Staging
  featureExperimental: false

ingress:
  enabled: true
  host: stg.kubescope.local

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
