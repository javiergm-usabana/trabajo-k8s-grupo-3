replicaCount: 1

image:
  repository: ghcr.io/javierg90/kubescope
  tag: "4e0a45c"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-credentials

app:
  environment: dev
  version: "4e0a45c"
  message: KubeScope - Development
  featureExperimental: true

ingress:
  enabled: true
  host: dev.kubescope.local

resources:
  requests:
    cpu: 25m
    memory: 48Mi
  limits:
    cpu: 150m
    memory: 128Mi

autoscaling:
  enabled: false
