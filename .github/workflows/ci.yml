name: CI and deploy DEV

on:
  push:
    branches: [main]
    paths-ignore:
      - helm/kubescope/values-dev.yaml
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --runInBand
      - run: pnpm run build
      - uses: azure/setup-helm@v4
      - run: helm lint ./helm/kubescope

  publish-and-update-dev:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define immutable image
        shell: bash
        run: |
          echo "IMAGE_REPOSITORY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kubescope" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ env.IMAGE_TAG }}
      - name: Update DEV desired state
        shell: bash
        run: |
          sed -i "s|^  repository:.*|  repository: ${IMAGE_REPOSITORY}|" helm/kubescope/values-dev.yaml
          sed -i "s|^  tag:.*|  tag: \"${IMAGE_TAG}\"|" helm/kubescope/values-dev.yaml
          sed -i "/^app:/,/^[^ ]/ s|^  version:.*|  version: \"${IMAGE_TAG}\"|" helm/kubescope/values-dev.yaml
      - name: Commit DEV deployment version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/kubescope/values-dev.yaml
          git commit -m "chore: deploy ${IMAGE_TAG} to dev [skip ci]"
          git push
